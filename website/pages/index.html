<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blackjack</title>

  <link rel="stylesheet" href="index.css" />
  <link rel="icon" type="image/x-icon" href="/website/favicon.ico">
</head>

<body>
  <main class="app">
    <section class="table">

      <header class="top-bar">
        <div>
          <h1>Blackjack</h1>
        </div> 
   

        <div class="stats">   
        
          <div>
            <span>Balance</span>
            <strong id="balance">$10,000</strong>
          </div>

          <div>
            <span>Bet</span>
            <strong id="currentBet">$0</strong>
          </div>

          <div>
            <span>Winstreak</span>
            <strong id="currentStreak">0</strong>
          </div>

          <div>
            <span>LoseStreak</span>
            <strong id="currentLose">0</strong>
          </div>
        </div>

        <div class="user-box">
          <span id="usernameText">Guest</span>
         

          <button id="logoutBtn" class="secondary">Log Out</button>
        </div>
      </header> 
      
     

      <section class="bet-panel">
        <input id="betInput" type="number" min="10" step="10" value="100" />
        <button id="allinBtn">All in</button>
        <button id="dealBtn">Deal</button>
        <button id="resetBtn" class="secondary">Reset</button> 
        <select id="themeSelect">
            <option value="theme-green">Classic Green</option>
            <option value="theme-dark">Dark Casino</option>
            <option value="theme-red">Red Casino</option>
            <option value="theme-pink">Pink Casino</option>
            <option value="theme-blue">Blue Casino</option>
         </select>
      </section>

      <section class="game-area">
        <div class="hand">
          <h2>Dealer <span id="dealerScore"></span></h2>
          <div id="dealerCards" class="cards"></div>
        </div>

        <div class="message">
          <div id="message">Place your bet and deal.</div>
        </div>

        <div class="hand">
          <h2>Player <span id="playerScore"></span></h2>
          <div id="playerCards" class="cards"></div>
        </div>
      </section>

      <section class="actions">
        <button id="hitBtn" disabled>Hit</button>
        <button id="standBtn" disabled>Stand</button>
        <button id="doubleBtn" disabled>Double</button>
      </section>

      <section class="leaderboard">
        <div class="leaderboard-header">
          <h2>Leaderboard</h2>
          <button id="refreshLeaderboardBtn" class="secondary">Refresh</button>
        </div>

        <div id="leaderboardList" class="leaderboard-list">
          Loading leaderboard...
        </div>
      </section>

    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
